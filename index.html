<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Désintégration PIT Archi</title>
<style>
:root{--b:#075ca8;--bd:#06457e;--g:#17864b;--o:#d47b00;--r:#c0392b;--bg:#f3f6f9;--ln:#dbe3ec;--tx:#17283b}*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:var(--bg);color:var(--tx)}button,input,select{font:inherit}header{background:linear-gradient(120deg,var(--bd),#0875c9);color:#fff;padding:12px 18px}.head{max-width:1280px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{font-size:21px;margin:0}.head p{margin:3px 0 0;opacity:.88;font-size:12px}.head-stats{display:flex;gap:8px}.pill{background:#ffffff20;border:1px solid #ffffff30;border-radius:20px;padding:6px 10px;white-space:nowrap}.wrap{max-width:1280px;margin:auto;padding:10px}.panel{background:#fff;border:1px solid var(--ln);border-radius:10px;box-shadow:0 2px 8px #1a39580b}.profile{padding:9px;display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:8px;align-items:end}.field label{display:block;font-size:11px;font-weight:700;color:#526274;margin-bottom:3px}.field input,.field select{width:100%;height:34px;border:1px solid #bfcbd8;border-radius:7px;padding:6px 9px}.btn{border:0;border-radius:7px;background:var(--b);color:#fff;font-weight:700;height:34px;padding:0 12px;cursor:pointer}.btn:hover{filter:brightness(.94)}.btn.light{background:#e9eff5;color:#254360}.btn.red{background:var(--r)}.status{display:none;margin:0 9px 9px;padding:6px 9px;border-radius:6px;font-size:12px}.status.ok{display:block;background:#e9f8ef;color:#126b3a}.status.err{display:block;background:#fdeceb;color:#9b2721}.layout{display:grid;grid-template-columns:230px 1fr;gap:10px;margin-top:10px}.side{padding:10px}.side h2,.calendar-head h2{font-size:15px;margin:0}.hint{font-size:11px;color:#68798b;margin:4px 0 8px}.top{list-style:none;padding:0;margin:0}.top li{display:grid;grid-template-columns:23px 1fr auto;gap:6px;align-items:center;border-top:1px solid #edf1f5;padding:6px 0}.rank{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e9f2fb;color:var(--b);font-weight:700;font-size:11px}.top-date{font-weight:700;font-size:12px}.top-rate{font-size:11px;color:var(--g)}.unavail-btn{width:100%;margin-top:8px}.calendar-box{padding:9px}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.nav{display:flex;gap:5px}.nav .btn{width:32px;padding:0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;font-size:10px;color:#6b7b8d;font-weight:700;padding:2px}.day{height:82px;border:1px solid var(--ln);border-radius:7px;padding:5px;overflow:hidden;position:relative;cursor:pointer}.day:hover{border-color:var(--b)}.day.out{opacity:.32}.day.closed{background:#f1f3f5;cursor:default}.day.good{background:#edf9f2}.day.mid{background:#fff8e7}.day.low{background:#fff0ee}.num{font-weight:800;font-size:12px}.ratio{font-size:10px;color:#53677b;margin-top:2px}.badges{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}.badge{background:#f8d8d4;color:#8f2f27;border-radius:9px;padding:2px 5px;font-size:9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge.mine{outline:1px solid var(--b)}.mine-mark{position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--r)}dialog{border:0;border-radius:10px;padding:0;width:min(420px,calc(100% - 24px));box-shadow:0 20px 55px #0005}dialog::backdrop{background:#07192f99}.modal{padding:14px}.modal h3{font-size:16px;margin:0 0 10px}.modal input{width:100%;height:36px;border:1px solid #bfcbd8;border-radius:7px;padding:7px}.actions{display:flex;gap:6px;margin-top:10px}.actions .btn{flex:1}.records{width:100%;border-collapse:collapse;font-size:12px}.records th,.records td{text-align:left;border-bottom:1px solid #e7edf3;padding:6px}.records th{background:#f6f8fa}.empty{color:#6b7b8d;font-size:12px;padding:8px 0}@media(max-width:850px){.layout{grid-template-columns:1fr}.profile{grid-template-columns:1fr 1fr}.side{order:2}.head-stats{display:none}}@media(max-width:550px){.profile{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(2,1fr)}.dow{display:none}.day{height:76px}.head p{display:none}}
</style></head>
<body><header><div class="head"><div><h1>Désintégration PIT Archi</h1><p>Créez votre profil, puis indiquez uniquement vos indisponibilités.</p></div><div class="head-stats"><span class="pill"><b id="profileCount">0</b> profils</span><span class="pill"><b id="unavailabilityCount">0</b> indisponibilités</span></div></div></header>
<main class="wrap">
<section class="panel"><div class="profile"><div class="field"><label>Nom *</label><input id="name" maxlength="80" placeholder="Prénom Nom"></div><div class="field"><label>Équipe</label><input id="team" maxlength="80" placeholder="Optionnel"></div><div class="field"><label>Filtrer</label><select id="filterPerson"><option value="">Toutes les personnes</option></select></div><button class="btn" id="saveProfile">Enregistrer le profil</button></div><div id="status" class="status"></div></section>
<div class="layout">
<aside class="panel side"><h2>Meilleures dates</h2><p class="hint">Disponibilité calculée automatiquement.</p><ol class="top" id="topDates"></ol><button class="btn light unavail-btn" id="showMine">Mes indisponibilités</button></aside>
<section class="panel calendar-box"><div class="calendar-head"><h2 id="monthTitle"></h2><div class="nav"><button class="btn light" id="prev">‹</button><button class="btn light" id="next">›</button></div></div><div class="calendar" id="calendar"></div></section>
</div></main>
<dialog id="entryDialog"><form class="modal" id="entryForm"><h3 id="dialogTitle"></h3><input type="hidden" id="entryDate"><label class="hint" for="comment">Commentaire facultatif</label><input id="comment" maxlength="200" placeholder="Ex. déplacement, congé..."><div class="actions"><button type="button" class="btn light" id="cancel">Annuler</button><button type="button" class="btn red" id="remove" style="display:none">Disponible</button><button type="submit" class="btn" id="saveEntry">Indisponible</button></div></form></dialog>
<dialog id="mineDialog"><div class="modal"><h3>Mes indisponibilités</h3><div style="max-height:360px;overflow:auto"><table class="records"><thead><tr><th>Date</th><th>Commentaire</th><th></th></tr></thead><tbody id="mineList"></tbody></table></div><div class="actions"><button class="btn light" id="closeMine">Fermer</button></div></div></dialog>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';import{getFirestore,collection,deleteDoc,doc,onSnapshot,query,orderBy,serverTimestamp,setDoc}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyAzPBMPPYI01-BLs9rhNzyNoZNPE0WLDOY",authDomain:"desintagrationpit.firebaseapp.com",databaseURL:"https://desintagrationpit-default-rtdb.europe-west1.firebasedatabase.app",projectId:"desintagrationpit",storageBucket:"desintagrationpit.firebasestorage.app",messagingSenderId:"459188539470",appId:"1:459188539470:web:a2ec183f7743422096f31f"};
const START=new Date(2026,8,24),END=new Date(2026,11,31),$=x=>document.getElementById(x),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,dateOf=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)},esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let db,user,profiles=[],entries=[],current=new Date(2026,8,1);
$('name').value=localStorage.getItem('pit_name')||'';$('team').value=localStorage.getItem('pit_team')||'';
function msg(t,ok){$('status').textContent=t;$('status').className=`status ${ok?'ok':'err'}`}function myEntry(d){return entries.find(e=>e.ownerUid===user?.uid&&e.date===d)}function myProfile(){return profiles.find(p=>p.ownerUid===user?.uid)}function allDates(){let a=[];for(let d=new Date(START);d<=END;d.setDate(d.getDate()+1))a.push(iso(d));return a}
$('saveProfile').onclick=async()=>{if(!user)return msg('Connexion en cours.',false);const name=$('name').value.trim();if(!name)return msg('Renseignez votre nom.',false);try{await setDoc(doc(db,'profiles',user.uid),{name,team:$('team').value.trim(),ownerUid:user.uid,updatedAt:serverTimestamp()},{merge:true});localStorage.setItem('pit_name',name);localStorage.setItem('pit_team',$('team').value.trim());msg('Profil enregistré. Vous êtes disponible par défaut.',true)}catch(e){msg(`Profil non enregistré : ${e.message}`,false)}};
function best(){return allDates().map(date=>{const unavailable=new Set(entries.filter(e=>e.date===date).map(e=>e.ownerUid)).size,available=Math.max(0,profiles.length-unavailable);return{date,available,unavailable,rate:profiles.length?Math.round(available*100/profiles.length):0}}).sort((a,b)=>b.available-a.available||a.unavailable-b.unavailable||a.date.localeCompare(b.date))}
function render(){refreshFilter();renderTop();renderCalendar();renderMine();$('profileCount').textContent=profiles.length;$('unavailabilityCount').textContent=entries.length}
function refreshFilter(){const keep=$('filterPerson').value;$('filterPerson').innerHTML='<option value="">Toutes les personnes</option>'+profiles.map(p=>`<option value="${esc(p.ownerUid)}">${esc(p.name)}</option>`).join('');$('filterPerson').value=profiles.some(p=>p.ownerUid===keep)?keep:''}
function renderTop(){$('topDates').innerHTML=profiles.length?best().slice(0,8).map((x,i)=>`<li><span class="rank">${i+1}</span><span class="top-date">${dateOf(x.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}</span><span class="top-rate">${x.available}/${profiles.length} · ${x.rate}%</span></li>`).join(''):'<li class="empty">Aucun profil enregistré.</li>'}
function renderCalendar(){$('monthTitle').textContent=current.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});const c=$('calendar');c.innerHTML='';['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].forEach(x=>c.insertAdjacentHTML('beforeend',`<div class="dow">${x}</div>`));const first=new Date(current.getFullYear(),current.getMonth(),1),offset=(first.getDay()+6)%7,start=new Date(first);start.setDate(first.getDate()-offset);for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=iso(d),allowed=d>=START&&d<=END,dayEntries=entries.filter(e=>e.date===key),filtered=dayEntries.filter(e=>!$('filterPerson').value||e.ownerUid===$('filterPerson').value),available=Math.max(0,profiles.length-new Set(dayEntries.map(e=>e.ownerUid)).size),rate=profiles.length?available/profiles.length:0,cell=document.createElement('div');cell.className=`day ${d.getMonth()===current.getMonth()?'':'out'} ${allowed?(rate>=.8?'good':rate>=.5?'mid':'low'):'closed'}`;cell.dataset.date=allowed?key:'';cell.innerHTML=`<span class="num">${d.getDate()}</span>${allowed?`${myEntry(key)?'<i class="mine-mark"></i>':''}<div class="ratio">${available}/${profiles.length} dispo</div><div class="badges">${filtered.slice(0,3).map(e=>`<span class="badge ${e.ownerUid===user?.uid?'mine':''}">${esc(e.name)}</span>`).join('')}${filtered.length>3?`<span class="badge">+${filtered.length-3}</span>`:''}</div>`:''}`;c.appendChild(cell)}c.querySelectorAll('.day[data-date]:not([data-date=""])').forEach(x=>x.onclick=()=>openEntry(x.dataset.date))}
function renderMine(){const mine=entries.filter(e=>e.ownerUid===user?.uid).sort((a,b)=>a.date.localeCompare(b.date));$('mineList').innerHTML=mine.length?mine.map(e=>`<tr><td>${dateOf(e.date).toLocaleDateString('fr-FR')}</td><td>${esc(e.comment)}</td><td><button class="btn" data-edit="${e.date}">Modifier</button></td></tr>`).join(''):'<tr><td colspan="3" class="empty">Aucune indisponibilité.</td></tr>';$('mineList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{$('mineDialog').close();openEntry(b.dataset.edit)})}
function openEntry(date){if(!myProfile())return msg('Créez d’abord votre profil.',false);const e=myEntry(date);$('entryDate').value=date;$('comment').value=e?.comment||'';$('dialogTitle').textContent=`${e?'Modifier':'Indisponible le'} ${dateOf(date).toLocaleDateString('fr-FR')}`;$('remove').style.display=e?'block':'none';$('entryDialog').showModal()}
$('entryForm').onsubmit=async ev=>{ev.preventDefault();const date=$('entryDate').value,p=myProfile();try{await setDoc(doc(db,'unavailability',`${user.uid}_${date}`),{date,name:p.name,team:p.team||'',comment:$('comment').value.trim(),ownerUid:user.uid,updatedAt:serverTimestamp()},{merge:true});$('entryDialog').close();msg('Indisponibilité enregistrée.',true)}catch(e){msg(`Enregistrement impossible : ${e.message}`,false)}};$('remove').onclick=async()=>{try{await deleteDoc(doc(db,'unavailability',`${user.uid}_${$('entryDate').value}`));$('entryDialog').close();msg('La date est de nouveau disponible.',true)}catch(e){msg(`Suppression impossible : ${e.message}`,false)}};$('cancel').onclick=()=>$('entryDialog').close();$('showMine').onclick=()=>$('mineDialog').showModal();$('closeMine').onclick=()=>$('mineDialog').close();$('filterPerson').onchange=renderCalendar;$('prev').onclick=()=>{current=new Date(current.getFullYear(),current.getMonth()-1,1);if(current<new Date(2026,8,1))current=new Date(2026,8,1);renderCalendar()};$('next').onclick=()=>{current=new Date(current.getFullYear(),current.getMonth()+1,1);if(current>new Date(2026,11,1))current=new Date(2026,11,1);renderCalendar()};
async function init(){try{const app=initializeApp(firebaseConfig);db=getFirestore(app);user=(await signInAnonymously(getAuth(app))).user;msg('Connexion Firebase active.',true);onSnapshot(query(collection(db,'profiles'),orderBy('name','asc')),s=>{profiles=s.docs.map(x=>({id:x.id,...x.data()}));const p=myProfile();if(p){$('name').value=p.name;$('team').value=p.team||''}render()},e=>msg(`Lecture des profils impossible : ${e.message}`,false));onSnapshot(query(collection(db,'unavailability'),orderBy('date','asc')),s=>{entries=s.docs.map(x=>({id:x.id,...x.data()}));render()},e=>msg(`Lecture impossible : ${e.message}`,false))}catch(e){msg(`Connexion impossible : ${e.message}`,false)}}init();
</script></body></html>
